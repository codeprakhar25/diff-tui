name: release

# Build binaries and attach them to the GitHub Release when a tag like v0.1.0
# is pushed. install.sh downloads these from /releases/latest/download/.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf \
            git-ui-${{ matrix.target }}.tar.gz git-ui

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: git-ui-${{ matrix.target }}.tar.gz
