name: publish

# Manual crates.io publish. Add a CARGO_REGISTRY_TOKEN repo secret first
# (Settings -> Secrets -> Actions), then run this workflow from the Actions tab.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package
        run: cargo publish --dry-run
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
