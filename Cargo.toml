[package]
name = "git-ui"
version = "0.1.0"
edition = "2024"
description = "A VS Code-style split git diff viewer for the terminal"
license = "MIT"
readme = "README.md"
keywords = ["git", "diff", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
ratatui = "0.30.1"
similar = "3.1.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
